[package]
name = "recast-text-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
percent-encoding = "2"
ttf-parser = "0.25"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.39"
wasmtime = { version = "50.0.0", default-features = false, features = ["cranelift", "runtime", "std", "gc", "gc-drc"] }
wasmtime-wasi = { version = "50.0.0", default-features = false, features = ["p1"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

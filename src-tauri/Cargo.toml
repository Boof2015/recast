[package]
name = "recast"
version = "0.1.0"
description = "A local file converter"
edition = "2021"

[lib]
name = "recast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
infer = "0.19"
tempfile = "3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }


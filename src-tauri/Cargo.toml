[package]
name = "recast"
version = "0.1.0"
description = "A local file converter"
edition = "2021"

[lib]
name = "recast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
infer = "0.19"
tempfile = "3"
serde_json = "1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
semver = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

